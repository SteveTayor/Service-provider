name: bundlegram
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  bloc: ^8.1.4
  device_preview: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.15
  flutter_gen_runner:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/svgs/
  fonts:
    - family: MabryPro
      fonts:
        - asset:  fonts/MabryPro-Medium.ttf
    - family: MabryProBold
      fonts:
        - asset:  fonts/MabryPro-Bold.ttf
          weight: 900