name: bundlegram
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.4

dependencies:
  bloc: ^9.0.0
  device_preview: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.1.0
  intl:
  go_router: ^13.2.0
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  riverpod_annotation: ^2.3.3
  dio: ^5.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  carousel_slider: ^5.0.0
  fl_chart: ^0.71.0
  http: ^1.4.0
  retrofit: ^4.4.2
  pretty_dio_logger: ^1.4.0
  url_launcher: ^6.3.1
  device_info_plus: 
  geolocator: ^14.0.2
  network_info_plus: ^6.1.4

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.15
  flutter_gen_runner:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.2
  riverpod_lint: ^2.3.7
  retrofit_generator: ^9.1.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/svgs/
  fonts:
    - family: MabryPro
      fonts:
        - asset:  fonts/MabryPro-Medium.ttf
    - family: MabryProBold
      fonts:
        - asset:  fonts/MabryPro-Bold.ttf
          weight: 900